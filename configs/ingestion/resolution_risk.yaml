source:
  dataset_id: "erm2-nwe9"
  base_url: "https://data.cityofnewyork.us/resource/erm2-nwe9.json"

scope:
  authority_file: "reports/05_temporal_stability/tables/selected_scope_summary.csv"
  extraction_metadata_file: "reports/05_temporal_stability/tables/extraction_metadata.csv"
  acceptable_decision_statuses:
    - "APPROVED"
    - "APPROVED_WITH_LIMITATIONS"

query:
  selected_columns:
    - unique_key
    - created_date
    - closed_date
    - due_date
    - agency
    - agency_name
    - complaint_type
    - descriptor
    - descriptor_2
    - status
    - borough
    - incident_zip
    - latitude
    - longitude
    - location_type
    - open_data_channel_type
    - resolution_description
    - resolution_action_updated_date
  order_by:
    - created_date ASC
    - unique_key ASC
  page_size: 10000

http:
  timeout_seconds: 60
  max_retries: 5
  initial_backoff_seconds: 1
  maximum_backoff_seconds: 30

output:
  root: "data/raw/nyc_311"
  format: "parquet"
  schema_version: "1.0"

